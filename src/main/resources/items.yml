# 装备示例；物品 ID、稀有度枚举、属性表达式、命令和权限节点必须保留程序格式。
# classes 中的 Assassin 是职业插件的示例 ID；名称和 lore 是玩家可见中文。
items:
  assassin-gloves:
    texture: DIAMOND_HOE:24
    name: "刺客手套"
    lore:
      - "&e&o行动如风，出手无声……"
    rarity: RARE
    unbreakable: true
    level: 4
    classes:
      - Assassin
    stats:
      - DAMAGE +5-10
      - BOW_DAMAGE +2
      - HAND_DAMAGE +3
      - CRIT_CHANCE +2%
      - SPEED +30%
      - JUMP +4
  ring-of-gods:
    texture: DIAMOND_HOE:23
    name: "诸神之戒"
    lore:
      - "&e&o相传诸神曾借助这枚戒指"
      - "&e&o掌握世界的秩序"
    rarity: LEGENDARY
    drop: false
    abilities:
      permissions:
        - essentials.gamemode
      right-click:
        op: true
        command: "time set day"
        lore: "切换为白天"
        message: "天色已经亮起！"
      left-click:
        op: true
        command: "weather clear"
        lore: "切换为晴天"
        message: "天空已经放晴！"
  mysterious-amulet:
    texture: DIAMOND_HOE:25
    name: "神秘护符"
    lore:
      - "&e&o没有人知道它的力量从何而来……"
    rarity: UNCOMMON
    hide-stats: true
    stats:
      - CRIT_DAMAGE +30-40%
      - ARMOR +50%
  artifact-of-knowledge:
    texture: DIAMOND_HOE:26
    name: "知识秘器"
    lore:
      - "&e&o蕴藏着新的合成知识"
    rarity: MYTHICAL
    abilities:
      permissions:
        - rpginventory.craft.journeyman
