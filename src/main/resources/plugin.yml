# 保留公开 Java 包名及依赖别名，确保已有插件集成仍可识别。
name: SX-RPGInventory
main: ru.endlesscode.rpginventory.RPGInventoryPlugin
version: '${version}'
# 1.12 忽略此字段；现代服务端依此避免按旧版模式改写物品材质。
api-version: '1.13'
authors: [OsipXD, EndlessCode Group, FxRayHughes]
provides: [RPGInventory]
depend:
  - Vault
softdepend:
  # 现代服务端优先使用 PacketEvents，旧部署仍可使用 ProtocolLib。
  - packetevents
  - ProtocolLib
  - SX-Item
  - Mimic
  - MyPet
  - PlaceholderAPI
  - ChestSort
loadbefore:
  - SX-Attribute

commands:
  rpginventory:
    description: SX-RPGInventory 装备与背包管理。
    aliases: [rpginv, sxrpginv, sxri]
    usage: /<command>

permissions:
  rpginventory.admin:
    description: 允许使用全部装备背包管理命令
    default: op
    children:
      rpginventory.user: true
      rpginventory.open.others: true
  rpginventory.user:
    description: 允许使用全部玩家命令
    default: true
    children:
      rpginventory.open: true
  rpginventory.open:
    description: 允许通过命令打开自己的装备背包
    default: true
  rpginventory.open.others:
    description: 允许通过命令查看自己或其他玩家的装备背包
    default: op
    children:
      rpginventory.open: true
  rpginventory.keep.items:
    description: 玩家死亡时保留全部物品
    default: op
  rpginventory.keep.armor:
    description: 玩家死亡时保留护甲
    default: op
  rpginventory.keep.rpginv:
    description: 玩家死亡时保留装备背包内的物品
    default: op
