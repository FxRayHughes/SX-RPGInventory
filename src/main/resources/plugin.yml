# Preserve the public Java package and dependency alias used by existing integrations.
name: SX-RPGInventory
main: ru.endlesscode.rpginventory.RPGInventoryPlugin
version: '${version}'
# 1.12 ignores this field; modern servers must not rewrite materials through legacy mode.
api-version: '1.13'
authors: [OsipXD, EndlessCode Group, FxRayHughes]
provides: [RPGInventory]
depend:
  - Vault
softdepend:
  # Modern servers prefer PacketEvents; ProtocolLib remains available for older deployments.
  - packetevents
  - ProtocolLib
  - SX-Item
  - Mimic
  - MyPet
  - PlaceholderAPI
  - ChestSort
loadbefore:
  - SX-Attribute

commands:
  rpginventory:
    description: SX-RPGInventory equipment and backpack management.
    aliases: [rpginv, sxrpginv, sxri]
    usage: /<command>

permissions:
  rpginventory.admin:
    description: Gives access to all RPGInventory commands
    default: op
    children:
      rpginventory.user: true
      rpginventory.open.others: true
  rpginventory.user:
    description: Gives access to all user commands
    default: true
    children:
      rpginventory.open: true
  rpginventory.open:
    description: Allows you to open inventory by command
    default: true
  rpginventory.open.others:
    description: Allows you to open your or other player's inventory by command
    default: op
    children:
      rpginventory.open: true
  rpginventory.keep.items:
    description: Player with this permission will not lose any items on dead
    default: op
  rpginventory.keep.armor:
    description: Player with this permission will not lose armor on dead
    default: op
  rpginventory.keep.rpginv:
    description: Player with this permission will not lose items from RPGInventory on dead
    default: op
